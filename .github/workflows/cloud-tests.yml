name: Firebase collaboration checks
on:
  push:
    branches: [feat/cabel-studio-library-routing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: test -x "$CHROMIUM_PATH"
      - run: node tests/linked-images-smoke.cjs
      - run: npm run test:firebase
      - run: npm run test:cloud
      - run: node tests/clipboard.cjs
      - run: node tests/clipboard-smoke.cjs
      - run: node scripts/build-libraries.cjs --check
      - run: node tests/manufacturer-smoke.cjs
      - run: node scripts/build-shortcuts.cjs --check
      - run: node tests/settings-smoke.cjs
      - run: node tests/symbol-editor-ui-smoke.cjs
      - run: node tests/supply-workflow.cjs
      - run: node tests/supply-workflow-smoke.cjs
      - run: node tests/basics-smoke.cjs
      - run: node tests/multi-connect.cjs
      - run: node tests/multi-connect-smoke.cjs
      - run: node tests/wire-batch.cjs
      - run: node tests/wire-batch-smoke.cjs
      - run: node tests/phone-viewer-smoke.cjs
      - run: node tests/electrical-checks.cjs
      - run: node tests/electrical-checks-smoke.cjs
      - run: node tests/electrical-core.cjs
      - run: node tests/electrical-network.cjs
      - run: node tests/product-loads.cjs
      - run: node tests/power-supply-loads.cjs
      - run: node tests/power-supply-loads-smoke.cjs
      - run: node tests/power-supply-input.cjs
      - run: node tests/power-supply-input-smoke.cjs
      - run: node tests/component-tabs-smoke.cjs
      - run: node tests/component-properties-smoke.cjs
      - run: node tests/product-loads-smoke.cjs
      - run: node tests/electrical-network-ui-smoke.cjs
      - run: node tests/electrical-ui-smoke.cjs
      - run: node tests/supply-symbol-smoke.cjs
      - run: node tests/cloud-local-smoke.cjs
      - run: node tests/cloud-ui-smoke.cjs
      - run: node tests/navigation-input-smoke.cjs
      - run: node tests/spacemouse-driver-smoke.cjs
      - run: node tests/pen-connections-smoke.cjs
      - run: node tests/pin-label-smoke.cjs
      - run: node tests/pdf-export-smoke.cjs
      - run: node tests/device-list-smoke.cjs
      - run: node tests/connection-lists-smoke.cjs
      - run: npm run build:firebase && npm run build:pdf && git diff --exit-code -- vendor/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebase-check-output
          path: |
            *-debug.log
            /tmp/Leitwerk-cloud-*.png
            /tmp/Leitwerk-clipboard-*
            /tmp/Leitwerk-supply-*
            /tmp/Leitwerk-basics*
            /tmp/Leitwerk-multi-connect-*
            /tmp/Leitwerk-wire-batch-*
            /tmp/Leitwerk-phone-viewer*
            /tmp/Leitwerk-settings-*
            /tmp/Leitwerk-symbol-editor-*
            /tmp/Leitwerk-product-loads-*
            /tmp/Leitwerk-psu-loads-*
            /tmp/Leitwerk-psu-input-*
            /tmp/Leitwerk-component-tabs-*
            /tmp/Leitwerk-network-*
            /tmp/Leitwerk-electrical-*
            /tmp/Leitwerk-navigation-*.png
            /tmp/Leitwerk-spacemouse-*.png
            /tmp/Leitwerk-pen-*.png
            /tmp/Leitwerk-vector-*.pdf
            /tmp/Leitwerk-linked-images-*
            /tmp/Leitwerk-device-list-*
            /tmp/Leitwerk-cable-list-*
            /tmp/Leitwerk-connection-list*
