name: Firebase collaboration checks
on:
  push:
    branches: [feat/cabel-studio-library-routing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:cloud
      - run: npm run build:firebase && git diff --exit-code -- vendor/
      - run: CHROMIUM_PATH="$(node -p "require('playwright').chromium.executablePath()")" npm run test:firebase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebase-check-output
          path: |
            *-debug.log
            /tmp/Leitwerk-cloud-*.png
