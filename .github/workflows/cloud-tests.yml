name: Firebase collaboration checks
on:
  push:
    branches: [feat/cabel-studio-library-routing]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cloud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --no-audit --no-fund
      - run: test -x "$CHROMIUM_PATH"
      - run: npm run test:cloud
      - run: node tests/cloud-local-smoke.cjs
      - run: node tests/cloud-ui-smoke.cjs
      - run: npm run build:firebase && git diff --exit-code -- vendor/
      - run: npm run test:firebase
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: firebase-check-output
          path: |
            *-debug.log
            /tmp/Leitwerk-cloud-*.png
